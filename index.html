r(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}.notice{background:#fff4ed;border:1px solid #f1d3c3;padding:14px;border-radius:15px}.patienthero{display:flex;justify-content:space-between;align-items:center}.avatar{width:54px;height:54px;border-radius:18px;background:var(--terra2);display:grid;place-items:center;font:900 22px Nunito}.profile{display:flex;gap:15px;align-items:center}.profile h2{margin:0 0 3px;font:800 26px Nunito}.stats{display:flex;gap:28px}.stats strong{font:900 26px Nunito;display:block}.stats small{color:var(--muted)}.flow{display:flex;justify-content:center;gap:12px;align-items:center;margin:18px 0;color:var(--muted);font-size:13px}.flow span{background:#fff;padding:9px 13px;border-radius:999px;border:1px solid var(--line)}.patientmap{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.patienttile{background:#fff;border:1px solid var(--line)}.patienttile:nth-child(3n+1){background:#fff8f4}.patienttile:nth-child(3n+2){background:#f7faf7}.patienttile:nth-child(3n){background:#f7fafc}.ico{font-size:22px}.calendarbar{display:flex;gap:8px;margin-bottom:16px}.calendarbar button.on{background:var(--ink);color:#fff}.financecards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}.financecards .card strong{font:900 28px Nunito;display:block;margin-top:6px}.modal{position:fixed;inset:0;background:rgba(43,24,20,.48);display:grid;place-items:center;padding:20px;z-index:10}.modalbox{width:min(760px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:26px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.22);position:relative}.x{position:absolute;right:18px;top:16px;border:0;background:#f6ede7;width:34px;height:34px;border-radius:50%;cursor:pointer}.modal h2{font:800 25px Nunito;margin:0 0 5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 6px}.span2{grid-column:span 2}.record{padding:16px 0;border- const $=s=>document.querySelector(s),app=$('#app'),KEY='fonely_v2';let old=JSON.parse(localStorage.getItem('fonely_v1')||'null');let db=JSON.parse(localStorage.getItem(KEY)||'null')||old||{user:null,patients:[],appointments:[],transactions:[],team:[],plans:[],evolutions:[],assessments:[],reports:[]};['patients','appointments','transactions','team','plans','evolutions','assessments','reports'].forEach(k=>db[k]??=[]);let page='inicio',pid=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(db)),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},fmt=d=>d?new Date(d+'T12:00').toLocaleDateString('pt-BR'):'—',money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),fd=f=>Object.fromEntries(new FormData(f).entries());function brand(){return `<div class="brand">fone<i>ly</i><small>gestão fonoaudiológica</small></div>`}function modal(h){$('#modalBody').innerHTML=h;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}function auth(sign=false){app.innerHTML=`<div class="auth"><div class="authbrand">${brand()}<h1>Mais escuta.<br>Mais conquistas.</h1><p>Organize sua rotina clínica com leveza.</p></div><div class="authform"><div class="authcard">${brand()}<h2>${sign?'Criar conta':'Bem-vinda ao Fonely'}</h2><p class="muted">${sign?'Configure seu espaço profissional.':'Entre no seu espaço clínico.'}</p><form id="login">${sign?`<div class="field"><label>Seu nome</label><input class="input" name="name" required></div><div class="field"><label>Tipo de conta</label><select name="type"><option>Profissional</option><option>Clínica / equipe</option></select></div>`:''}<div class="field"><label>E-mail</label><input class="input" type="email" name="email" required></div><div class="field"><label>Senha</label><input class="input" type="password" name="password" minlength="6" required></div>${sign?`<div class="field"><label>Cupom</label><input class="input" name="coupon"></div>`:''}<button class="btn primary" style="width:100%;margin-top:8px">${sign?'Criar conta':'Entrar'}</button></form><p style="text-align:center"><a class="click" onclick="auth(${!sign})">${sign?'Já tenho conta':'Criar minha conta'}</a></p><div class="notice" style="font-size:11px">Protótipo de demonstração: autenticação e dados ainda são locais neste navegador.</div></div></div></div>`;$('#login').onsubmit=e=>{e.preventDefault();let x=fd(e.target);db.user={name:x.name||x.email.split('@')[0],email:x.email,type:x.type||'Profissional'};save();render()}}function shell(content,title='',action=''){let nav=[['inicio','⌂  Início'],['agenda','▣  Agenda'],['pacientes','♡  Pacientes'],['financeiro','◫  Financeiro'],['equipe','♙  Minha equipe'],['relatorios','▤  Relatórios']];return `<div class="shell"><aside class="side">${brand()}<div class="nav">${nav.map(n=>`<button class="${page===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}<button class="academy" onclick="go('academy')">✦ Fonely Academy <span class="soon">EM BREVE</span></button></div><div class="user"><b>${esc(db.user.name)}</b><br>${esc(db.user.email||'')}<br><br><span class="click" onclick="logout()">Sair</span></div></aside><main class="main">${title?`<div class="pagehead"><h1>${title}</h1><div>${action}</div></div>`:''}${content}</main></div>`}function go(p){page=p;pid=null;render()}function logout(){db.user=null;save();auth()}function pname(id){return db.patients.find(p=>p.id===id)?.name||'Paciente'}function remaining(p){let used=db.appointments.filter(a=>a.patientId===p.id&&a.status==='Concluído'&&a.payment==='Pacote').length;return Math.max(0,Number(p.packageTotal||0)-used)}function render(){if(!db.user)return auth();let f={inicio:dashboard,agenda, pacientes,financeiro,equipe,relatorios,academy};app.innerHTML=(f[page]||dashboard)()}function dashboard(){let aps=db.appointments.filter(a=>a.date===today()).sort((a,b)=>(a.time||'').localeCompare(b.time||'')),next=aps.find(a=>a.status!=='Concluído'&&a.status!=='Cancelado');return shell(`<div class="welcome"><div><h1>Olá, ${esc(db.user.name)} 👋</h1><p>Sua rotina clínica, organizada em um só lugar.</p></div><span class="chip">${esc(db.user.type||'Espaço profissional')}</span></div><div class="dash"><div class="card today"><span class="eyebrow">Agenda de hoje</span><div class="big">${aps.length}</div><span class="muted">atendimento${aps.length===1?'':'s'} programado${aps.length===1?'':'s'}</span><div class="next">${next?`<span class="eyebrow">Próximo atendimento</span><br><b style="font-size:22px">${esc(next.time)} · ${esc(pname(next.patientId))}</b><br><span class="muted">${esc(next.type||'Atendimento')} · ${esc(next.modality||'Presencial')}</span>`:'<b>Agenda tranquila por enquanto ✨</b><br><span class="muted">Seus próximos atendimentos aparecerão aqui.</span>'}</div></div><div class="quick"><button onclick="go('pacientes')"><span class="ico">♡</span><b>Pacientes</b><small>Prontuários e acompanhamento</small></button><button onclick="go('financeiro')"><span class="ico">◫</span><b>Financeiro</b><small>Pacotes e pagamentos</small></button><button onclick="pickPatient('Avaliações')"><span class="ico">⌁</span><b>Avaliações</b><small>Avaliar e reavaliar</small></button><button onclick="go('relatorios')"><span class="ico">▤</span><b>Relatórios</b><small>Documentação clínica</small></button></div></div><div class="lower"><div class="card"><div class="sectiontop"><h3>Hoje</h3><button class="btn ghost" onclick="go('agenda')">Ver agenda →</button></div>${aps.length?aps.map(a=>`<div class="row click" onclick="openPatient('${a.patientId}')"><div><b>${esc(a.time)} · ${esc(pname(a.patientId))}</b><br><small class="muted">${esc(a.type||'Atendimento')}</small></div><span class="pill">${esc(a.status||'Agendado d"><label>Nome do pai</label><input class="input" name="father"></div><div class="field"><label>Responsável</label><input class="input" name="responsible"></div><div class="field"><label>Área principal</label><select name="area"><option>Linguagem</option><option>Fala / Fonologia</option><option>Voz</option><option>Fluência</option><option>Motricidade Orofacial</option><option>Disfagia</option><option>Audiologia</option><option>Outra</option></select></div><div class="field"><label>Pacote de sessões</label><input class="input" type="number" min="0" name="packageTotal"></div><div class="field span2"><label>Queixa principal</label><textarea name="complaint"></textarea></div></div><button class="btn primary">Cadastrar paciente</button></form>`);$('#pf').onsubmit=e=>{e.preventDefault();let p={...fd(e.target),id:uid(),status:'Ativo',documents:[]};db.patients.push(p);save();closeModal();after?appointmentForm(p.id):openPatient(p.id)}}function openPatient(id){pid=id;page='pacientes';let p=db.patients.find(x=>x.id===id);if(!p)return go('pacientes');let ass=db.assessments.filter(x=>x.patientId===id),pl=db.plans.filter(x=>x.patientId===id),ev=db.evolutions.filter(x=>x.patientId===id);app.innerHTML=shell(`<div class="card patienthero"><div class="profile"><div class="avatar">${esc(p.name[0])}</div><div><span class="eyebrow">Prontuário</span><h2>${esc(p.name)}</h2><span class="muted">${esc(p.area||'Paciente')} ${p.responsible?'· Resp. '+esc(p.responsible):''}</span></div></div><div class="stats"><div><strong>${ass.length}</strong><small>Avaliações</small></div><div><strong>${pl.length}</strong><small>Metas</small></div><div><strong>${ev.length}</strong><small>Evoluções</small></div></div></div><div class="flow"><span>Avaliação</span>→<span>Plano terapêutico</span>→<span>Evoluções</span>→<span>Reavaliação</span></div><div class="patientmap">${[['📝','Anamnese','Histórico inicial'],['⌁','Avaliações','Avaliar e reavaliar'],['◎','Plano Terapêutico','Objetivos, metas e progresso'],['✎','Evoluções','Linha do tempo das sessões'],['▣','Documentos Clínicos','Laudos, exames, fotos e áudios'],['▤','Relatórios','Documentação profissional'],['◫','Financeiro','Pacotes e pagamentos']].map(x=>`<button class="patienttile" onclick="patientArea('${x[1]}')"><span class="ico">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div>`,'Prontuário',`<button class="btn primary" onclick="appointmentForm('${p.id}')">+ Agendar atendimento</button>`)}function patientArea(area){let p=db.patients.find(x=>x.id===pid);if(area==='Financeiro'){closeModal();page='financeiro';return render()}if(area==='Anamnese')return anam(p);if(area==='Avaliações')return assessments(p);if(area==='Plano Terapêutico')return plans(p);if(area==='Evoluções')return evolutions(p);if(area==='Documentos Clínicos')return documents(p);if(area==='Relatórios')return patientReports(p)}function anam(p){modal(`<h2>Anamnese</h2><p class="muted">${esc(p.name)}</p><form id="anam"><div class="formgrid"><div class="field span2"><label>Queixa principal</label><textarea name="complaint">${esc(p.complaint||'')}</textarea></div><div class="field span2"><label>Gestação, nascimento e desenvolvimento</label><textarea name="history">${esc(p.history||'')}</textarea></div><div class="field span2"><label>Comunicação, fala e linguagem</label><textarea name="communication">${esc(p.communication||'')}</textarea></div><div class="field"><label>Alimentação e funções orais</label><textarea name="feeding">${esc(p.feeding||'')}</textarea></div><div class="field"><label>Audição e voz</label><textarea name="hearingVoice">${esc(p.hearingVoice||'')}</textarea></div><div class="field span2"><label>Escola, comportamento e observações</label><textarea name="other">${esc(p.other||'')}</textarea></div></div><button class="btn primary">Salvar anamnese</button></form>`);$('#anam').onsubmit=e=>{e.preventDefault();Object.assign(p,fd(e.target));save();closeModal()}}function assessments(p){let list=db.assessments.filter(x=>x.patientId===p.id);modal(`<div class="sectiontop"><div><h2>Avaliações</h2><p class="muted">${esc(p.name)}</p></div><button class="btn primary" onclick="assessmentForm('${p.id}')">+ Nova</button></div>${list.map(x=>`<div class="record"><b>${esc(x.kind)} · ${fmt(x.date)}</b><br><small class="muted">${esc(x.area)} · ${esc(x.protocol||'Registro clínico')}</small><p>${esc(x.summary)}</p></div>`).join('')||'<div class="empty">Nenhuma avaliação registrada.</div>'}`)}function assessmentForm(id){modal(`<h2>Nova avaliação</h2><form id="af"><div class="formgrid"><div class="field"><label>Tipo</label><select name="kind"><option>Avaliação inicial</option><option>Reavaliação</option></select></div><div class="field"><label>Data</label><input class="input" type="date" name="date" value="${today()}"></div><div class="field"><label>Área</label><input class="input" name="area" placeholder="Ex.: Linguagem"></div><div class="field"><label>Protocolo</label><input class="input" name="protocol"></div><div class="field span2"><label>Resultados e observações</label><textarea name="summary" required></textarea></div></div><button class="btn primary">Salvar</button></form>`);$('#af').onsubmit=e=>{e.preventDefault();db.assessments.push({...fd(e.target),id:uid(),patientId:id});save();assessments(db.patients.find(p=>p.id===id))}}function plans(p){let list=db.plans.filter(x=>x.patientId===p.id);modal(`<div class="sectiontop"><div><h2>Plano Terapêutico</h2><p class="muted">Objetivos, metas, condutas e reavaliação.</p></div><button class="btn primary" onclick="planForm('${p.id}')">+ Nova meta</button></div>${list.map(x=>`<div class="record"><span class="eyebrow">${esc(x.objective)}</span><h3>${esc(x.goal)}</h3><p>${esc(x.intervention||'')}</p><div class="progress"><i style="width:${Math.min(100,Number(x.progress||0))}%"></i></div><small>${Number(x.progress||0)}% · prazo ${fmt(x.deadline)} · reavaliar ${fmt(x.review)}</small></div>`).join('')||'<div class="empty">Nenhuma meta criada.</div>'}`)}function planForm(id){modal(`<h2>Nova meta terapêutica</h2><form id="plf"><div class="formgrid"><div class="field span2"><label>Objetivo</label><input class="input" name="objective" required></div><div class="field span2"><label>Meta mensurável</label><input class="input" name="goal" required></div><div class="field span2"><label>Intervenções / estratégias</label><textarea name="intervention"></textarea></div><div class="field"><label>Prazo</label><input class="input" type="date" name="deadline"></div><div class="field"><label>Reavaliação</label><input class="input" type="date" name="review"></div><div class="field"><label>Progresso %</label><input class="input" type="number" min="0" max="100" value="0" name="progress"></div></div><button class="btn primary">Salvar meta</button></form>`);$('#plf').onsubmit=e=>{e.preventDefault();db.plans.push({...fd(e.target),id:uid(),patientId:id,date:today()});save();plans(db.patients.find(p=>p.id===id))}}function evolutions(p){let list=db.evolutions.filter(x=>x.patientId===p.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));modal(`<div class="sectiontop"><div><h2>Evoluções</h2><p class="muted">Linha do tempo terapêutica.</p></div><button class="btn primary" onclick="evolutionForm('${p.id}')">+ Evolução</button></div>${list.map(x=>`<div class="record"><b>${fmt(x.date)} · ${esc(x.focus||'Atendimento')}</b><p>${esc(x.text)}</p><small class="muted">Conduta: ${esc(x.conduct||'—')}</small></div>`).join('')||'<div class="empty">Nenhuma evolução registrada.</div>'}`)}function evolutionForm(id){modal(`<h2>Registrar evolução</h2><form id="ef"><div class="formgrid"><div class="field"><label>Data</label><input class="input" type="date" name="date" value="${today()}"></div><div class="field"><label>Foco da sessão</label><input class="input" name="focus"></div><div class="field span2"><label>Evolução</label><textarea name="text" required></textarea></div><div class="field span2"><label>Conduta / orientação</label><textarea name="conduct"></textarea></div></div><button class="btn primary">Salvar</button></form>`);$('#ef').onsubmit=e=>{e.preventDefault();db.evolutions.push({...fd(e.target),id:uid(),patientId:id});save();evolutions(db.patients.find(p=>p.id===id))}}function documents(p){p.documents??=[];modal(`<div class="sectiontop"><div><h2>Documentos Clínicos</h2><p class="muted">Laudos, exames, fotos, vídeos e áudios.</p></div><button class="btn primary" onclick="documentForm('${p.id}')">+ Documento</button></div>${p.documents.map(x=>`<div class="record"><b>${esc(x.title)}</b><br><small>${esc(x.type)} · ${fmt(x.date)}</small><p>${esc(x.note||'')}</p></div>`).join('')||'<div class="empty">Nenhum documento registrado.</div>'}<div class="notice">O upload real será conectado quando o armazenamento seguro estiver ativo.</div>`)}function documentForm(id){modal(`<h2>Novo documento</h2><form id="df"><div class="field"><label>Título</label><input class="input" name="title" required></div><div class="field"><label>Tipo</label><select name="type"><option>Laudo</option><option>Exame</option><option>Foto</option><option>Vídeo</option><option>Áudio / amostra de fala</option><option>Parecer</option><option>TCLE</option><option>Outro</option></select></div><div class="field"><label>Data</label><input class="input" type="date" name="date" value="${today()}"></div><div class="field"><label>Observação</label><textarea name="note"></textarea></div><br><button class="btn primary">Salvar</button></form>`);$('#df').onsubmit=e=>{e.preventDefault();let p=db.patients.find(x=>x.id===id);p.documents??=[];p.documents.push({...fd(e.target),id:uid()});save();documents(p)}}function patientReports(p){let list=db.reports.filter(x=>x.patientId===p.id);modal(`<div class="sectiontop"><div><h2>Relatórios</h2><p class="muted">Documentação profissional.</p></div><button class="btn primary" onclick="reportForm('${p.id}')">+ Relatório</button></div>${list.map(x=>`<div class="record"><b>${esc(x.title)}</b><br><small>${esc(x.type)} · ${fmt(x.date)}</small><p>${esc(x.summary)}</p></div>`).join('')||'<div class="empty">Nenhum relatório criado.</div>'}`)}function reportForm(id){modal(`<h2>Novo relatório</h2><form id="rf"><div class="formgrid"><div class="field"><label>Tipo</label><select name="type"><option>Acompanhamento</option><option>Avaliação</option><option>Evolução</option><option>Encaminhamento</option></select></div><div class="field"><label>Data</label><input class="input" type="date" name="date" value="${today()}"></div><div class="field span2"><label>Título</label><input class="input" name="title" required></div><div class="field span2"><label>Conteúdo</label><textarea name="summary" required></textarea></div></div><button class="btn primary">Salvar relatório</button></form>`);$('#rf').onsubmit=e=>{e.preventDefault();db.reports.push({...fd(e.target),id:uid(),patientId:id});save();patientReports(db.patients.find(p=>p.id===id))}}function agenda(){let list=[...db.appointments].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return shell(`<div class="card">${list.length?list.map(a=>`<div class="row"><div class="click" onclick="openPatient('${a.patientId}')"><b>${fmt(a.date)} · ${esc(a.time)} · ${esc(pname(a.patientId))}</b><br><small class="muted">${esc(a.type||'Atendimento')} · ${esc(a.modality||'Presencial')} · ${esc(a.payment||'')}</small></div><span class="pill">${esc(a.status||'Agendado')}</span></div>`).join(''):'<div class="empty">Nenhum agendamento ainda.</div>'}</div>`,'Agenda',`<button class="btn primary" onclick="newAppointment()">+ Novo agendamento</button>`)}function newAppointment(){modal(`<h2>Novo agendamento</h2><p class="muted">Primeiro, escolha quem será atendido.</p><div class="quick" style="margin-top:20px"><button onclick="chooseExisting()"><span class="ico">♡</span><b>Paciente cadastrado</b><small>Buscar alguém do Fonely</small></button><button onclick="newPatient(true)"><span class="ico">＋</span><b>Novo paciente</b><small>Cadastrar sem sair da agenda</small></button></div>`)}function chooseExisting(){if(!db.patients.length)return newPatient(true);modal(`<h2>Escolher paciente</h2><div class="field"><label>Paciente</label><select id="pick"><option value="">Selecione...</option>${db.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><br><button class="btn primary" onclick="let v=$('#pick').value;v?appointmentForm(v):alert('Selecione um paciente')">Continuar</button>`)}function appointmentForm(id){let p=db.patients.find(x=>x.id===id);modal(`<h2>Agendar atendimento</h2><p class="muted">${esc(p.name)} ${p.packageTotal?'· '+remaining(p)+' sessões restantes':''}</p><form id="apf"><div class="formgrid"><div class="field"><label>Data</label><input class="input" type="date" name="date" value="${today()}" required></div><div class="field"><label>Horário</label><input class="input" type="time" name="time" required></div><div class="field"><label>Tipo</label><select name="type"><option>Avaliação</option><option>Atendimento</option><option>Reavaliação</option><option>Retorno</option></select></div><div class="field"><label>Modalidade</label><select name="modality"><option>Presencial</option><option>Online</option><option>Domiciliar</option></select></div><div class="field"><label>Pagamento</label><select name="payment"><option>Pacote</option><option>Avulso</option><option>Pendente</option></select></div><div class="field"><label>Valor</label><input class="input" type="number" step=".01" name="value"></div></div><button class="btn primary">Agendar</button></form>`);$('#apf').onsubmit=e=>{e.preventDefault();db.appointments.push({...fd(e.target),id:uid(),patientId:id,status:'Agendado'});save();closeModal();page='agenda';render()}}function financeiro(){let paid=db.transactions.filter(x=>x.status==='Pago').reduce((s,x)=>s+Number(x.value||0),0),pending=db.transactions.filter(x=>x.status!=='Pago').reduce((s,x)=>s+Number(x.value||0),0);return shell(`<div class="financecards"><div class="card"><span class="eyebrow">Recebido</span><strong>${money(paid)}</strong></div><div class="card"><span class="eyebrow">Pendente</span><strong>${money(pending)}</strong></div><div class="card"><span class="eyebrow">Lançamentos</span><strong>${db.transactions.length}</strong></div></div><div class="card">${db.transactions.map(t=>`<div class="row"><div><b>${esc(pname(t.patientId))}</b><br><small>${fmt(t.date)} · ${esc(t.description||'Atendimento')}</small></div><div><b>${money(t.value)}</b> <span class="pill">${esc(t.status)}</span></div></div>`).join('')||'<div class="empty">Nenhum lançamento financeiro.</div>'}</div>`,'Financeiro',`<button class="btn primary" onclick="transactionForm()">+ Registrar recebimento</button>`)}function transactionForm(){if(!db.patients.length)return newPatient();modal(`<h2>Novo lançamento</h2><form id="tf"><div class="formgrid"><div class="field span2"><label>Paciente</label><select name="patientId">${db.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Valor</label><input class="input" type="number" step=".01" name="value" required></div><div class="field"><label>Data</label><input class="input" type="date" name="date" value="${today()}"></div><div class="field"><label>Status</label><select name="status"><option>Pago</option><option>Pendente</option></select></div><div class="field"><label>Descrição</label><input class="input" name="description"></div></div><button class="btn primary">Salvar</button></form>`);$('#tf').onsubmit=e=>{e.preventDefault();db.transactions.push({...fd(e.target),id:uid()});save();closeModal();render()}}function equipe(){return shell(`<div class="card">${db.team.map(m=>`<div class="row"><div><b>${esc(m.name)}</b><br><small>${esc(m.role||'Fonoaudiólogo(a)')} · ${esc(m.email||'')}</small></div><span class="pill">${esc(m.permission||'Clínico')}</span></div>`).join('')||'<div class="empty">Nenhum membro adicionado. Contas individuais podem usar o Fonely normalmente.</div>'}</div>`,'Minha equipe',`<button class="btn primary" onclick="teamForm()">+ Adicionar profissional</button>`)}function teamForm(){modal(`<h2>Adicionar profissional</h2><form id="tm"><div class="field"><label>Nome</label><input class="input" name="name" required></div><div class="field"><label>E-mail</label><input class="input" type="email" name="email"></div><div class="field"><label>Função</label><select name="role"><option>Fonoaudiólogo(a)</option><option>Estagiário(a)</option><option>Administrativo</option></select></div><div class="field"><label>CRFa / identificação</label><input class="input" name="crfa"></div><div class="field"><label>Permissão</label><select name="permission"><option>Clínico</option><option>Agenda</option><option>Administrativo</option><option>Acesso total</option></select></div><br><button class="btn primary">Adicionar</button></form>`);$('#tm').onsubmit=e=>{e.preventDefault();db.team.push({...fd(e.target),id:uid()});save();closeModal();render()}}function relatorios(){return shell(`<div class="card"><h3>Relatórios clínicos</h3><p class="muted">Os relatórios ficam vinculados ao prontuário de cada paciente.</p>${db.reports.length?db.reports.map(r=>`<div class="row click" onclick="openPatient('${r.patientId}')"><div><b>${esc(r.title)}</b><br><small>${esc(pname(r.patientId))} · ${fmt(r.date)}</small></div><span class="pill">${esc(r.type)}</span></div>`).join(''):'<div class="empty">Nenhum relatório criado.</div>'}</div>`,'Relatórios',`<button class="btn primary" onclick="pickPatient('Relatórios')">+ Novo relatório</button>`)}function pickPatient(area){if(!db.patients.length)return newPatient();modal(`<h2>Escolher paciente</h2><select id="pp"><option value="">Selecione...</option>${db.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><br><br><button class="btn primary" onclick="let v=$('#pp').value;if(v){pid=v;patientArea('${area}')}else alert('Selecione um paciente')">Continuar</button>`)}function academy(){return shell(`<div class="card" style="min-height:380px;display:grid;place-items:center;text-align:center"><div><div style="font-size:52px">✦</div><h2 style="font:900 34px Nunito;margin:8px">Fonely Academy</h2><p class="muted">Conteúdos e cursos para fonoaudiólogos.<br>Essa área chega em uma próxima fase.</p><span class="chip">EM BREVE</span></div></div>`,'Fonely Academy')}
try{render()}catch(e){console.error(e);app.innerHTML='<div style="padding:40px;font-family:sans-serif"><h2>Fonely</h2><p>Ocorreu um erro ao iniciar. Limpe os dados locais deste protótipo e recarregue.</p><pre>'+String(e)+'</pre></div>'}
</script></body></html>
